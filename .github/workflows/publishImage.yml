name: Publish Docker image to Dockerhub and GHCR

on:
  push:
    branches:
      - 'test'
      - 'Holaf_tests'
    tags:
      - '*.*.*'
    # don't trigger if just updating docs
    paths-ignore:
      - '**.md'

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    # only run if we've specified image tag to push to
    if: ${{ vars.DOCKERHUB_IMAGE_NAME != '' ||  vars.GHCR_IMAGE_NAME != '' }}
    # https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
    permissions:
      packages: write
      contents: read
    steps:
#      - name: Free Disk Space
#        uses: jlumbroso/free-disk-space@main
#        with:
#          tool-cache: true

          # all of these default to true, but feel free to set to
          # false if necessary for your workflow
#          android: true
#          dotnet: true
#          haskell: true
#          large-packages: true
#          swap-storage: true
      - name: Check out the repo
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && vars.GHCR_IMAGE_NAME != '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            ${{ vars.DOCKERHUB_IMAGE_NAME }}
            ${{ vars.GHCR_IMAGE_NAME }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=branch,enable=${{ !endsWith(github.ref, 'main') }}
            type=semver,pattern={{version}}
#            type=raw,value=latest,enable=${{ endsWith(github.ref, 'main') }}
#          flavor: |
#            latest=false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Forks should consume their OWN prebuilt wheels without having to edit the
      # Dockerfile, but must not break before they have published any. So: use
      # this repo owner's wheels images if they actually exist, otherwise fall
      # back to the upstream default baked into the Dockerfile.
      #
      # A fork therefore works immediately on upstream's wheels, and switches to
      # its own the moment it runs the build-wheels workflow once.
      - name: Resolve wheels source
        id: wheels
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          candidate="ghcr.io/${owner}/sd-wheels"

          # Every profile must be present, or the build would fail on the one
          # that is missing. Profile list comes from cuda-profiles.sh.
          . ./cuda-profiles.sh
          missing=0
          for profile in ${SD_CUDA_PROFILES}; do
            if docker buildx imagetools inspect "${candidate}:${profile}" >/dev/null 2>&1; then
              echo "found ${candidate}:${profile}"
            else
              echo "missing ${candidate}:${profile}"
              missing=1
            fi
          done

          if [ "$missing" = "0" ]; then
            echo "Using this repository's own wheels: ${candidate}"
            echo "image=${candidate}" >> "$GITHUB_OUTPUT"
          else
            echo "Falling back to the upstream wheels default in the Dockerfile."
            echo "Run the 'Build CUDA wheel images' workflow to publish your own."
            echo "image=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && !env.ACT}}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Empty means "leave the Dockerfile default alone" -- build-push-action
          # skips build-args whose value is empty.
          build-args: |
            ${{ steps.wheels.outputs.image && format('WHEELS_IMAGE={0}', steps.wheels.outputs.image) || '' }}