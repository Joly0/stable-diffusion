name: Build CUDA wheel images

# Builds one `FROM scratch` wheels image per CUDA profile and pushes it to GHCR.
#
# Design notes, because the previous version of this workflow was the main pain
# point in the repo:
#
#   * Triggers are workflow_dispatch + the few paths that actually invalidate
#     wheels. These artifacts only change when torch / CUDA / python change, so
#     they must NOT be in the ordinary commit loop.
#
#   * Work is split into one job per (profile, package). Each gets its own 6 h
#     budget, its own 14 GB of runner disk, and they all run in parallel --
#     instead of one serial job that has to fit every compile into a single
#     budget and OOMs partway through.
#
#   * flash-attn is fetched, not compiled (see scripts/fetch-flash-attn.sh). It
#     used to dominate the build. Its job needs no CUDA image at all.
#
#   * The old workflow set `no-cache: true` alongside `cache-from: type=gha`,
#     which cancelled the cache out and made every run cold. Gone.
#
#   * Every version comes from cuda-profiles.sh via scripts/profile-matrix.sh.
#     Nothing is hardcoded here.
#
# Hosted runners are used deliberately: this repo is public, so they are free
# and unmetered, and they are NOT the same machine as the self-hosted Unraid
# runner that keeps running out of memory.

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Space-separated profiles to build (default: all)'
        required: false
        default: ''
  push:
    paths:
      - 'Dockerfile.buildbase'
      - 'cuda-profiles.sh'
      - 'scripts/fetch-flash-attn.sh'
      - 'scripts/profile-matrix.sh'
      - 'docker/Dockerfile.wheels-assemble'
      - '.github/workflows/build-wheels.yml'

env:
  REGISTRY: ghcr.io
  PYTHON_TAG: cp312
  PYTHON_VERSION: '3.12'

jobs:
  # ---------------------------------------------------------------------------
  # Derive the matrix from cuda-profiles.sh so CI and runtime cannot drift.
  # ---------------------------------------------------------------------------
  matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.gen.outputs.profiles }}
      builds: ${{ steps.gen.outputs.builds }}
      image_name: ${{ steps.owner.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4

      # Every fork publishes to its OWN namespace -- nothing here is hardcoded to
      # a particular owner. GHCR rejects uppercase in a repository path, and
      # github.repository_owner preserves the account's original casing, so it
      # has to be lowercased or the push fails for anyone with capitals in their
      # username.
      - id: owner
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${owner}/sd-wheels" >> "$GITHUB_OUTPUT"
          echo "publishing to ghcr.io/${owner}/sd-wheels"

      - id: gen
        env:
          SD_PROFILES: ${{ github.event.inputs.profiles }}
        run: |
          set -euo pipefail
          echo "profiles=$(./scripts/profile-matrix.sh profiles)" >> "$GITHUB_OUTPUT"
          echo "builds=$(./scripts/profile-matrix.sh builds)"     >> "$GITHUB_OUTPUT"
          echo "--- profiles ---"; ./scripts/profile-matrix.sh profiles | python3 -m json.tool
          echo "--- builds ---";   ./scripts/profile-matrix.sh builds   | python3 -m json.tool

  # ---------------------------------------------------------------------------
  # Prebuilt wheels: pure download, no CUDA image, ~1 minute.
  # ---------------------------------------------------------------------------
  fetch-prebuilt:
    name: fetch prebuilt (${{ matrix.profile }})
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prebuilt flash-attention wheel
        env:
          SD_CUDA_MAJOR: ${{ matrix.cuda_major }}
          SD_TORCH_VERSION: ${{ matrix.torch_version }}
          PYTHON_TAG: ${{ env.PYTHON_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # SD_FLASH_ATTN_VERSION / _REPO come from cuda-profiles.sh.
          . ./cuda-profiles.sh
          export SD_FLASH_ATTN_VERSION SD_FLASH_ATTN_REPO
          mkdir -p out
          ./scripts/fetch-flash-attn.sh out
          ls -la out || true

      # Wheels are optional, so allow an empty directory rather than failing.
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.profile }}-prebuilt
          path: out/
          if-no-files-found: ignore
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Compiled wheels: one job per (profile, package).
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.package }} (${{ matrix.profile }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.builds) }}
    steps:
      # Disk is the binding constraint on a hosted runner: the CUDA devel image
      # alone is ~10 GB against a 14 GB default. This must be the first step.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.package }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.buildbase
          push: false
          # Export the scratch stage straight to disk. No image is produced or
          # pushed here -- the assemble job turns the collected wheels into one.
          outputs: type=local,dest=./out
          build-args: |
            CUDA_IMAGE=${{ matrix.cuda_image }}
            SD_CUDA_PROFILE=${{ matrix.profile }}
            SD_CUDA_MAJOR=${{ matrix.cuda_major }}
            TORCH_INDEX_URL=${{ matrix.torch_index }}
            SD_TORCH_SPEC=${{ matrix.torch_spec }}
            SD_TORCH_VERSION=${{ matrix.torch_version }}
            TORCH_CUDA_ARCH_LIST=${{ matrix.arch_list }}
            SD_SAGE_ARCH_LIST=${{ matrix.sage_arch_list }}
            SD_BUILD_PACKAGES=${{ matrix.package }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            PYTHON_TAG=${{ env.PYTHON_TAG }}
            # Hosted runners have 16 GB. Tell max-jobs explicitly: a RUN step
            # reads the host's /proc/meminfo, not its cgroup cap, and would
            # otherwise size the job count for a much bigger machine.
            BUILD_MEM_GB=14
          # Registry cache shared across runs. Scoped per profile+package so
          # jobs never overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.profile }}-${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}-${{ matrix.package }}

      - name: Show what was produced
        run: ls -la ./out/wheels || echo "no wheels produced"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.profile }}-${{ matrix.package }}
          path: ./out/wheels/*.whl
          if-no-files-found: ignore
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Collect every artifact for a profile into one scratch image and push it.
  # ---------------------------------------------------------------------------
  assemble:
    name: assemble ${{ matrix.profile }}
    needs: [matrix, fetch-prebuilt, build]
    # Publish whatever succeeded: a single package failing should not block the
    # rest of the profile, since each wheel is independently optional.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download this profile's wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-${{ matrix.profile }}-*
          path: staging
          merge-multiple: true

      - name: Collect and describe
        run: |
          set -euo pipefail
          mkdir -p wheels
          find staging -name '*.whl' -exec cp -v {} wheels/ \; 2>/dev/null || true
          {
            echo "profile=${{ matrix.profile }}"
            echo "cuda_major=${{ matrix.cuda_major }}"
            echo "torch=${{ matrix.torch_version }}"
            echo "torch_index=${{ matrix.torch_index }}"
            echo "python_tag=${{ env.PYTHON_TAG }}"
            echo "arch_list=${{ matrix.arch_list }}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=${GITHUB_SHA}"
            echo "wheels:"
            ls -1 wheels 2>/dev/null | sed 's/^/  /'
          } > wheels/MANIFEST.txt
          cat wheels/MANIFEST.txt

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Push wheels image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.wheels-assemble
          push: true
          platforms: linux/amd64
          build-args: |
            SD_CUDA_PROFILE=${{ matrix.profile }}
            SD_TORCH_VERSION=${{ matrix.torch_version }}
          # Two tags: a stable one the runtime Dockerfile tracks, and an
          # immutable coordinate tag so a specific build can be pinned.
          tags: |
            ${{ env.REGISTRY }}/${{ needs.matrix.outputs.image_name }}:${{ matrix.profile }}
            ${{ env.REGISTRY }}/${{ needs.matrix.outputs.image_name }}:${{ matrix.profile }}-torch${{ matrix.torch_version }}-${{ env.PYTHON_TAG }}
